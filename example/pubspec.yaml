name: demopod
description: 'A SolidPod Demonstrator.'
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  editable: ^2.0.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  intl: any
  markdown_tooltip: ^0.0.10
  rdflib: ^0.2.12
  solidpod: ^0.12.0
  solidui: ^0.3.2
  universal_io: ^2.3.1
  window_manager: ^0.5.1

dependency_overrides:
  solidpod:
    path: ..

dev_dependencies:
  dependency_validator: ^5.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
