name: demopod
description: 'A SolidPod Demonstrator.'
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  editable: ^2.0.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  intl: ^0.20.2
  markdown_tooltip: ^0.0.10
  rdflib: ^0.2.12
  solidpod: ^1.0.5
  solidui: ^1.0.6
  universal_io: ^2.3.1
  window_manager: ^0.5.1

dependency_overrides:
  solidpod:
    path: ..
  solidui:
    git:
      url: https://github.com/anusii/solidui.git
      ref: tony/622_save_large_files_to_external_pod

dev_dependencies:
  dependency_validator: ^5.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
