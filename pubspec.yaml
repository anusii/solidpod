name: solidpod
description: Support access to private data from PODs on Solid servers.
version: 1.0.11
homepage: https://github.com/anusii/solidpod

# Scaffold a new Solid Pod file-browser app (a pod browser, with navigation
# rail and status bar, built on solidui) from the bundled template:
#
#   dart run solidpod:create my_pod_app
#
# Or, after `flutter pub global activate solidpod`:
#
#   solidpod create my_pod_app

executables:
  solidpod: create

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=1.17.0'

# To automatically upgrade package dependencies to the latest versions:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.0.8
  crypto: ^3.0.7
  cryptography_plus: ^3.0.0
  encrypter_plus: ^5.1.0
  fast_rsa: ^3.8.6
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  mime: ^2.0.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  petitparser: ^6.1.0
  pointycastle: ^4.0.0
  rdflib: ^0.2.12
  solid_auth: ^1.0.2
  universal_io: ^2.3.1

dev_dependencies:
  build_runner: ^2.10.5
  custom_lint: ^0.8.1
  dependency_validator: ^5.0.4
  flutter_lints: ^6.0.0
  import_order_lint: ^0.2.2

flutter:
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/default_image.jpg
    - assets/images/default_logo.png
