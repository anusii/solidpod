name: solidpod
description: Support access to private data from PODs on Solid servers.
version: 0.7.11
homepage: https://github.com/anusii/solidpod

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=1.17.0'

dependencies:
  crypto: ^3.0.6
  encrypter_plus: ^5.1.0
  fast_rsa: ^3.7.1
  flutter:
    sdk: flutter
  flutter_form_builder: ^10.0.1
  flutter_secure_storage: ^10.0.0-beta.4
  #flutter_secure_storage_linux: ^2.0.1
  #flutter_svg: ^2.0.17
  form_builder_validators: ^11.1.2
  http: ^1.3.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  loading_indicator: ^3.1.1
  markdown_tooltip: ^0.0.7
  mime: ^2.0.0
  package_info_plus: ^8.1.4
  path: ^1.9.0
  pointycastle: ^4.0.0
  rdflib: ^0.2.11
  # solid_auth: ^0.1.27
  solid_auth:
    # path: ../solid-auth
    git:
      url: https://github.com/anusii/solid_auth
      ref: dev
  openid_client:
    # path: ../openid_client
    git:
      url: https://github.com/anusii/openid_client
      ref: av/custom_edits_for_solid_auth
  universal_io: ^2.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  editable: ^2.0.0
  file_picker: ^10.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  window_manager: ^0.5.1
  build_runner: ^2.8.0
  custom_lint: ^0.8.1
  import_order_lint: ^0.2.2
  ubuntu_lints: ^0.4.1+1

flutter:
  assets:
    - assets/images/default_image.jpg
    - assets/images/default_logo.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
