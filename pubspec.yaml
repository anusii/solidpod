name: solidpod
description: Support access to private data from PODs on Solid servers.
version: 0.9.12
homepage: https://github.com/anusii/solidpod

environment:
  sdk: ">=3.2.3 <4.0.0"
  flutter: ">=1.17.0"

# To automatically upgrade package dependencies to the latest versions:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  encrypter_plus: ^5.1.0
  fast_rsa: ^3.8.6
  flutter_form_builder: ^10.2.0
  flutter_secure_storage: ^10.0.0
  form_builder_validators: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  markdown_tooltip: ^0.0.10
  mime: ^2.0.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  pointycastle: ^4.0.0
  rdflib: ^0.2.12
  solid_auth: ^0.1.28
  universal_io: ^2.3.1

dev_dependencies:
  build_runner: ^2.10.5
  custom_lint: ^0.8.1
  # Keep dependency checker quiet.
  demopod:
    path: example
  editable: ^2.0.0
  file_picker: ^10.3.9
  flutter_lints: ^6.0.0
  import_order_lint: ^0.2.2
  # Keep dependency checker quiet.
  solidui: ^0.0.25
  ubuntu_lints: ^0.4.1+1
  window_manager: ^0.5.1

dependency_overrides:
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/images/default_image.jpg
    - assets/images/default_logo.png
