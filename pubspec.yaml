name: solidpod
description: Support access to private data from PODs on Solid servers.
version: 0.6.10
homepage: https://github.com/anusii/solidpod

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=1.17.0'

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.6
  encrypt: ^5.0.3
  fast_rsa: ^3.7.1
  flutter_form_builder: ^10.0.1
  flutter_secure_storage: ^10.0.0-beta.4
  flutter_secure_storage_linux: ^2.0.1
  flutter_svg: ^2.0.17
  form_builder_validators: ^11.1.2
  http: ^1.3.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  loading_indicator: ^3.1.1
  mime: ^2.0.0
  package_info_plus: ^8.1.4
  path: ^1.9.0
  pointycastle: ^3.9.1
  rdflib: ^0.2.11
  solid_auth: ^0.1.27
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.14
  custom_lint: ^0.7.0
  flutter_lints: ^5.0.0
  lints: ^5.1.1
  ubuntu_lints: ^0.4.1

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

flutter:
  assets:
    - assets/images/default_image.jpg
    - assets/images/default_logo.png
